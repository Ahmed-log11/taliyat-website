<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>كشف توقيع لجنة اختبار — مؤسسة التاليات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2a26; --muted:#6b7a73; --line:#e2dcc9; --soft:#faf7ef;
    --accent:#205040; --accent-dark:#163a2e; --accent-soft:#E9DEC2; --gold:#C0A050;
    --bg:#f3f0e7; --danger:#b42318;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:16px}
  input{font:inherit;color:inherit}

  /* شريط الأدوات */
  .toolbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;
           padding:12px;background:rgba(243,240,231,.92);backdrop-filter:blur(6px)}
  .btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;
       background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn:active{transform:translateY(1px)}

  /* الورقة */
  .sheet{max-width:920px;margin:8px auto 40px;background:#fff;border-radius:16px;
         padding:36px 48px 44px;box-shadow:0 8px 30px rgba(32,80,64,.08);border-top:5px solid var(--gold)}
  .brand{text-align:center;margin-bottom:6px}
  .brand img{height:110px}
  .divider{display:flex;align-items:center;gap:10px;margin:4px auto 18px;max-width:360px}
  .divider::before,.divider::after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .divider span{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
  .title{text-align:center;font-size:22px;font-weight:700;line-height:2.2;margin:0;color:var(--accent)}
  .line-input{border:0;border-bottom:1.5px dashed #cdbf95;background:transparent;
              text-align:center;padding:0 4px;outline:none}
  .line-input:focus{border-bottom-color:var(--accent)}
  .w-s{width:70px}.w-m{width:140px}.w-l{width:200px}
  .title .w-l{width:150px}.title .w-m{width:90px}.title .w-s{width:64px}
  .title{font-size:21px}

  .meta{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:center;
        padding:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px;margin-bottom:24px}
  .meta label{font-weight:600}
  .meta .line-input{font-weight:400}

  /* الجدول */
  table{width:100%;border-collapse:collapse}
  th,td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
  th{background:var(--accent);color:#fff;font-weight:600;border-color:var(--accent)}
  td.num{width:44px;color:var(--muted)}
  td input{width:100%;border:0;outline:none;background:transparent;text-align:center;padding:6px 2px}
  td input:focus{background:#fbfdfc;box-shadow:inset 0 -2px 0 var(--accent)}
  .col-name{width:30%}.col-id{width:18%}.col-sig{width:24%}
  .sig-cell{height:54px;border-radius:8px;display:flex;align-items:center;justify-content:center;
            color:#a0a8b5;font-size:13px;background:repeating-linear-gradient(45deg,#fcfaf4,#fcfaf4 6px,#f6f1e4 6px,#f6f1e4 12px)}
  td.del{width:40px;border:0}
  .del-btn{border:0;background:none;color:var(--danger);font-size:20px;cursor:pointer;opacity:.6}
  .del-btn:hover{opacity:1}
  .empty{color:var(--muted);padding:22px}

  /* المعلمة */
  .teacher{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:40px;flex-wrap:wrap}
  .teacher .block{display:flex;align-items:center;gap:10px}
  .teacher label{font-weight:700}
  .teacher .sig-cell{width:220px}

  /* خانات التوقيع القابلة للضغط */
  .sig-cell.tap{cursor:pointer;transition:background .15s}
  .sig-cell.tap:hover{background:var(--accent-soft);color:var(--accent)}
  .sig-cell.signed{background:none}
  .sig-cell img{max-height:50px;max-width:100%}

  /* نافذة التوقيع */
  .modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
         background:rgba(15,23,42,.45);padding:16px}
  .modal.open{display:flex}
  .modal-box{background:#fff;border-radius:18px;padding:22px;width:min(640px,100%);
             box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal-box h2{margin:0 0 4px;font-size:20px}
  .modal-box p{margin:0 0 14px;color:var(--muted)}
  .pad-wrap{position:relative;border:2px dashed #c4ccd8;border-radius:14px;background:#fcfdfd}
  #pad{display:block;width:100%;height:240px;touch-action:none;cursor:crosshair}
  .pad-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            color:#cdbf95;font-size:18px;pointer-events:none}
  .pad-base{position:absolute;right:24px;left:24px;bottom:56px;border-bottom:1px solid #e3e7ee;pointer-events:none}
  .modal-actions{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
  .btn.ghost{background:var(--soft)}

  @media (max-width:640px){ .sheet{padding:24px 16px;border-radius:0} .title{font-size:18px} }

  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff}
    .no-print{display:none !important}
    .sheet{box-shadow:none;margin:0;padding:0;max-width:none;border-top:0}
    .brand img{height:90px}
    .meta,.divider span,.divider::before,.divider::after{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .line-input{border-bottom:1px dotted #888}
    .sig-cell{background:none}
    ::placeholder{color:transparent !important}
    tr{break-inside:avoid}
    .empty{display:none}
    .teacher{break-inside:avoid}
    th{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:var(--accent) !important;color:#fff !important}
  }
</style>
</head>

<div class="toolbar no-print">
  <button class="btn primary" id="addBtn">＋ إضافة طالبة</button>
  <button class="btn" id="printBtn">حفظ PDF / طباعة</button>
  <button class="btn" id="newBtn">كشف جديد</button>
</div>

  <h1 class="title">
    كشف توقيع لجنة اختبار طالبات حلقة
    <input class="line-input w-l" data-h="halaqa" placeholder="اسم الحلقة">
    الفصل
    <input class="line-input w-m" data-h="term" placeholder="الأول">
    عام
    <input class="line-input w-s" data-h="year" placeholder="١٤٤٧">هـ
  </h1>
  <div class="divider"><span></span></div>

  <div class="meta">
    <div><label>اليوم:</label> <input class="line-input w-m" data-h="day" placeholder="الأحد"></div>
    <div><label>التاريخ:</label> <input class="line-input w-m" data-h="date" placeholder="  /  /١٤٤٧هـ"></div>
    <div><label>رقم اللجنة:</label> <input class="line-input w-s" data-h="committee" placeholder="١"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>م</th>
        <th class="col-name">اسم الطالبة</th>
        <th class="col-id">رقم الهوية</th>
        <th class="col-sig">التوقيع</th>
        <th>الملاحظات</th>
        <th class="no-print" style="border:0;background:none"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="teacher">
    <div class="block">
      <label>اسم المعلمة:</label>
      <input class="line-input w-l" id="teacherName" placeholder="الاسم">
    </div>
    <div class="block">
      <label>التوقيع:</label>
      <div class="sig-cell tap" id="teacherSig"></div>
    </div>
  </div>
</main>

<div class="modal no-print" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">التوقيع</h2>
    <p>وقّعي داخل المربع بإصبعك أو بالقلم</p>
    <div class="pad-wrap">
      <canvas id="pad"></canvas>
      <div class="pad-base"></div>
      <div class="pad-hint" id="padHint">وقّعي هنا</div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="clearBtn">مسح</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="cancelBtn">إلغاء</button>
        <button class="btn primary" id="okBtn">اعتماد التوقيع</button>
      </div>
    </div>
  </div>
</div>

<script>
  const KEY = 'kashf-tawqee-v1';
  const blank = () => ({ header:{}, students:[], teacher:{ name:'', sig:null } });

  let state = load();

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || blank(); }
    catch(e){ return blank(); }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  }

  // رأس الكشف
  document.querySelectorAll('[data-h]').forEach(inp => {
    inp.value = state.header[inp.dataset.h] || '';
    inp.addEventListener('input', () => { state.header[inp.dataset.h] = inp.value; save(); });
  });

  // اسم المعلمة
  const teacherName = document.getElementById('teacherName');
  teacherName.value = state.teacher.name || '';
  teacherName.addEventListener('input', () => { state.teacher.name = teacherName.value; save(); });

  // الجدول
  const tbody = document.getElementById('rows');

  function render(){
    tbody.innerHTML = '';
    if (!state.students.length){
      tbody.innerHTML = '<tr><td colspan="5" class="empty">لا توجد طالبات بعد — اضغطي «إضافة طالبة»</td></tr>';
      return;
    }
    state.students.forEach((s, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="num">${i + 1}</td>
        <td><input data-f="name" placeholder="اسم الطالبة"></td>
        <td><input data-f="id" inputmode="numeric" maxlength="10" placeholder="١٠ أرقام"></td>
        <td><div class="sig-cell tap"></div></td>
        <td><input data-f="note"></td>
        <td class="del no-print"><button class="del-btn" title="حذف">×</button></td>`;
      tr.querySelectorAll('input').forEach(inp => {
        inp.value = s[inp.dataset.f] || '';
        inp.addEventListener('input', () => { s[inp.dataset.f] = inp.value; save(); });
      });
      const cell = tr.querySelector('.sig-cell');
      paintSig(cell, s.sig);
      cell.onclick = () => openPad(s.name ? 'توقيع: ' + s.name : 'توقيع الطالبة رقم ' + (i + 1), sig => {
        s.sig = sig; save(); paintSig(cell, sig);
      });
      tr.querySelector('.del-btn').onclick = () => {
        if (s.sig && !confirm('هذه الطالبة وقّعت، حذفها نهائياً؟')) return;
        state.students.splice(i, 1); save(); render();
      };
      tbody.appendChild(tr);
    });
  }

  document.getElementById('addBtn').onclick = () => {
    state.students.push({ name:'', id:'', note:'', sig:null });
    save(); render();
    const inputs = tbody.querySelectorAll('input[data-f="name"]');
    inputs[inputs.length - 1].focus();
  };

  document.getElementById('newBtn').onclick = () => {
    if (!confirm('بدء كشف جديد؟ سيتم مسح البيانات الحالية.')) return;
    state = blank(); save(); location.reload();
  };

  // عرض التوقيع داخل الخانة
  function paintSig(cell, sig){
    if (sig){
      cell.classList.add('signed');
      cell.innerHTML = `<img src="${sig}" alt="توقيع">`;
    } else {
      cell.classList.remove('signed');
      cell.innerHTML = '<span class="no-print">اضغطي للتوقيع</span>';
    }
  }

  // ===== لوحة التوقيع =====
  const modal = document.getElementById('modal');
  const pad = document.getElementById('pad');
  const ctx = pad.getContext('2d');
  const hint = document.getElementById('padHint');
  let drawing = false, hasInk = false, last = null, onDone = null;

  function setupCanvas(){
    const r = pad.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    pad.width = r.width * dpr;
    pad.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#163a2e';
    hasInk = false; hint.style.display = '';
  }

  function pos(e){
    const r = pad.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  pad.addEventListener('pointerdown', e => {
    drawing = true; last = pos(e);
    pad.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fill();
    hasInk = true; hint.style.display = 'none';
  });
  pad.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    // منحنى ناعم بدل خطوط مكسّرة
    const mx = (last.x + p.x) / 2, my = (last.y + p.y) / 2;
    ctx.quadraticCurveTo(last.x, last.y, mx, my);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
    pad.addEventListener(ev, () => { drawing = false; }));

  function openPad(title, cb){
    document.getElementById('modalTitle').textContent = title;
    onDone = cb;
    modal.classList.add('open');
    ctx.fillStyle = '#163a2e';
    requestAnimationFrame(() => { setupCanvas(); ctx.fillStyle = '#163a2e'; });
  }
  function closePad(){ modal.classList.remove('open'); onDone = null; }

  // قص الفراغ حول التوقيع عشان يطلع واضح داخل الجدول
  function trimmed(){
    const { width:w, height:h } = pad;
    const data = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = 0, maxY = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      if (data[(y * w + x) * 4 + 3] > 0){
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    const m = 8;
    minX = Math.max(0, minX - m); minY = Math.max(0, minY - m);
    maxX = Math.min(w, maxX + m); maxY = Math.min(h, maxY + m);
    const out = document.createElement('canvas');
    out.width = maxX - minX; out.height = maxY - minY;
    out.getContext('2d').drawImage(pad, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    return out.toDataURL('image/png');
  }

  document.getElementById('clearBtn').onclick = setupCanvas;
  document.getElementById('cancelBtn').onclick = closePad;
  document.getElementById('okBtn').onclick = () => {
    if (!hasInk){ alert('المربع فاضي، وقّعي أولاً'); return; }
    const sig = trimmed();
    if (onDone) onDone(sig);
    closePad();
  };
  window.addEventListener('resize', () => { if (modal.classList.contains('open')) setupCanvas(); });

  // توقيع المعلمة
  const teacherSig = document.getElementById('teacherSig');
  paintSig(teacherSig, state.teacher.sig);
  teacherSig.onclick = () => openPad(
    state.teacher.name ? 'توقيع المعلمة: ' + state.teacher.name : 'توقيع المعلمة',
    sig => { state.teacher.sig = sig; save(); paintSig(teacherSig, sig); });

  // ===== الطباعة / PDF =====
  document.getElementById('printBtn').onclick = () => {
    const unsigned = state.students.filter(s => !s.sig).length;
    if (unsigned && !confirm(`باقي ${unsigned} طالبة ما وقّعت. تكملين الطباعة؟`)) return;
    window.print();
  };

  render();
</script>
</body>
</html>
