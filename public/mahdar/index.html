<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>محضر اجتماع — مؤسسة التاليات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2a26; --muted:#6b7a73; --line:#cfc6b2; --label:#E8E1D6;
    --accent:#205040; --accent-dark:#163a2e; --gold:#C0A050; --bg:#f3f0e7; --danger:#b42318;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px}
  input,textarea{font:inherit;color:inherit}

  /* شريط الأدوات */
  .toolbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
           padding:12px;background:rgba(243,240,231,.92);backdrop-filter:blur(6px)}
  .btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;
       background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn.ghost{background:#f6f3ea}
  .btn:active{transform:translateY(1px)}

  /* الورقة: نفس ورق التاليات الرسمي */
  .sheet{position:relative;max-width:840px;margin:8px auto 28px;background:#fff;
         aspect-ratio:210/297;padding:21% 11.5% 16% 8.5%;box-shadow:0 8px 30px rgba(32,80,64,.10)}
  /* ورق التاليات الرسمي كصورة داخل كل صفحة (تنطبع في كل المتصفحات) */
  .lh{position:absolute;top:0;left:0;width:100%;height:auto;z-index:0;pointer-events:none;user-select:none}
  .sheet > :not(.lh){position:relative;z-index:1}
  .title{width:70%;margin:0 auto 14px;background:var(--label);text-align:center;
         font-size:22px;font-weight:700;padding:6px}
  .subtitle{width:70%;margin:22px auto 10px;background:var(--label);text-align:center;
            font-size:17px;font-weight:700;padding:5px}

  table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.85)}
  th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:middle}
  .info{width:80%;margin:0 auto}
  .info th{width:24%;background:var(--label);text-align:right;font-weight:700}
  td input{width:100%;border:0;outline:none;background:transparent;padding:4px 2px}
  td input:focus,textarea:focus{box-shadow:inset 0 -2px 0 var(--accent)}

  .members td{width:33.33%;text-align:center;height:32px}

  .section{margin-top:22px}
  .section h3{margin:0 0 6px;font-size:17px}
  .section h3::before{content:"❖";color:var(--gold);margin-left:8px}
  textarea{width:100%;min-height:90px;border:1px dashed var(--line);border-radius:8px;
           background:rgba(255,255,255,.85);padding:8px 10px;outline:none;resize:none;
           line-height:1.9;overflow:hidden}

  /* جدول الحضور */
  .attend th{background:var(--label);font-weight:600;text-align:center}
  .attend td{text-align:center}
  .attend td input{text-align:center}
  td.del{width:36px;border:0;background:#fff}
  .del-btn{border:0;background:none;color:var(--danger);font-size:20px;cursor:pointer;opacity:.6}
  .del-btn:hover{opacity:1}
  .empty{color:var(--muted);padding:18px}

  .sig-cell{height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;
            color:#a99e82;font-size:13px;
            background:repeating-linear-gradient(45deg,#fcfaf4,#fcfaf4 6px,#f6f1e4 6px,#f6f1e4 12px)}
  .sig-cell.tap{cursor:pointer}
  .sig-cell.tap:hover{background:#E9DEC2;color:var(--accent)}
  .sig-cell.signed{background:none}
  .sig-cell img{max-height:44px;max-width:100%}

  /* نافذة التوقيع */
  .modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
         background:rgba(15,23,42,.45);padding:16px}
  .modal.open{display:flex}
  .modal-box{background:#fff;border-radius:18px;padding:22px;width:min(640px,100%);
             box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal-box h2{margin:0 0 4px;font-size:20px}
  .modal-box p{margin:0 0 14px;color:var(--muted)}
  .pad-wrap{position:relative;border:2px dashed #c4ccd8;border-radius:14px;background:#fcfdfd}
  #pad{display:block;width:100%;height:240px;touch-action:none;cursor:crosshair}
  .pad-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            color:#cdbf95;font-size:18px;pointer-events:none}
  .pad-base{position:absolute;right:24px;left:24px;bottom:56px;border-bottom:1px solid #e3e7ee;pointer-events:none}
  .modal-actions{display:flex;gap:10px;justify-content:space-between;margin-top:14px}


  @media (max-width:640px){
    .sheet{aspect-ratio:auto;background:#fff;padding:24px 14px}
    .lh{display:none}
    .info,.title,.subtitle{width:100%}
  }

  @media print{
    @page{size:A4;margin:8mm}
    body{background:none;font-size:13px}
    .no-print{display:none !important}
    /* كل صفحة بمقاس A4 ثابت، والورق الرسمي داخلها */
    .sheet{width:100%;max-width:none;margin:0 auto;aspect-ratio:210/297;height:auto;overflow:hidden;
           padding:21% 11.5% 16% 8.5%;box-shadow:none;break-after:page;page-break-after:always}
    .sheet:last-of-type{break-after:auto;page-break-after:auto}
    .lh{height:100%}
    table,textarea{background:transparent}
    textarea{border:0;padding:0 4px;min-height:0}
    .sig-cell{background:none;height:30px}
    .sig-cell img{max-height:28px}
    .attend td{padding:2px 6px}
    tr{break-inside:avoid}
    .empty{display:none}
    ::placeholder{color:transparent !important}
    th,.title,.subtitle{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="toolbar no-print">
  <button class="btn primary" id="addBtn">＋ إضافة عضو</button>
  <button class="btn" id="printBtn">حفظ PDF</button>
  <button class="btn" id="newBtn">محضر جديد</button>
</div>

<!-- الصفحة الأولى: المحضر -->
<main class="sheet">
  <img class="lh" alt="">
  <div class="title">محضر اجتماع</div>
  <table class="info">
    <tr><th>اليوم</th><td><input data-h="day" placeholder="الأحد"></td></tr>
    <tr><th>التاريخ</th><td><input data-h="date" placeholder="  /  /١٤٤٧هـ"></td></tr>
    <tr><th>رقم الاجتماع</th><td><input data-h="num"></td></tr>
    <tr><th>زمن الاجتماع</th><td><input data-h="duration" placeholder="مثلاً: ساعة"></td></tr>
    <tr><th>وقت الاجتماع</th><td><input data-h="time" placeholder="مثلاً: ٨:٠٠ مساءً"></td></tr>
  </table>

  <div class="subtitle">أعضاء الاجتماع</div>
  <table class="members"><tbody id="members"></tbody></table>

  <div class="section">
    <h3>محاور الاجتماع:</h3>
    <textarea data-h="topics" placeholder="اكتب محاور الاجتماع، كل محور في سطر"></textarea>
  </div>
  <div class="section">
    <h3>التوصيات:</h3>
    <textarea data-h="recs" placeholder="اكتب التوصيات، كل توصية في سطر"></textarea>
  </div>
</main>

<!-- الصفحة الثانية: توقيع الحضور -->
<main class="sheet">
  <img class="lh" alt="">
  <div class="title">توقيع حضور الاجتماع</div>
  <table class="info">
    <tr><th>اليوم</th><td class="mirror" data-m="day"></td></tr>
    <tr><th>التاريخ</th><td class="mirror" data-m="date"></td></tr>
  </table>

  <table class="attend" style="margin-top:22px">
    <thead>
      <tr>
        <th style="width:36%">الاسم</th>
        <th style="width:30%">المسمى الوظيفي</th>
        <th>التوقيع</th>
        <th class="no-print" style="border:0;background:#fff"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<div class="modal no-print" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">التوقيع</h2>
    <p>وقّع داخل المربع بإصبعك أو بالقلم</p>
    <div class="pad-wrap">
      <canvas id="pad"></canvas>
      <div class="pad-base"></div>
      <div class="pad-hint" id="padHint">وقّع هنا</div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="clearBtn">مسح</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="cancelBtn">إلغاء</button>
        <button class="btn primary" id="okBtn">اعتماد التوقيع</button>
      </div>
    </div>
  </div>
</div>

  document.querySelectorAll('.lh').forEach(i => i.src = LH);

  const KEY = 'mahdar-ijtima-v1';
  const blank = () => ({ header:{}, people:[] });
  let state = load();

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || blank(); }
    catch(e){ return blank(); }
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  // تكبير خانات النص مع الكتابة
  function grow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

  // بيانات المحضر
  document.querySelectorAll('[data-h]').forEach(el => {
    el.value = state.header[el.dataset.h] || '';
    el.addEventListener('input', () => {
      state.header[el.dataset.h] = el.value; save();
      if (el.tagName === 'TEXTAREA') grow(el);
      mirror();
    });
  });
  document.querySelectorAll('textarea').forEach(grow);
  window.addEventListener('beforeprint', () => document.querySelectorAll('textarea').forEach(grow));

  // اليوم والتاريخ في صفحة الحضور يُنقلون تلقائياً من المحضر
  function mirror(){
    document.querySelectorAll('[data-m]').forEach(td => td.textContent = state.header[td.dataset.m] || '');
  }

  // أعضاء الاجتماع: تتعبى تلقائياً من أسماء الحضور (٣ في كل صف)
  function renderMembers(){
    const tb = document.getElementById('members');
    const names = state.people.map(p => p.name).filter(n => n.trim());
    const cells = Math.max(6, Math.ceil(names.length / 3) * 3);
    let html = '';
    for (let i = 0; i < cells; i += 3){
      html += '<tr>' + [0,1,2].map(k => `<td>${esc(names[i + k] || '')}</td>`).join('') + '</tr>';
    }
    tb.innerHTML = html;
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // جدول الحضور
  const tbody = document.getElementById('rows');
  function render(){
    tbody.innerHTML = '';
    renderMembers();
    if (!state.people.length){
      tbody.innerHTML = '<tr><td colspan="3" class="empty">لا يوجد أعضاء بعد — اضغط «إضافة عضو»</td></tr>';
      return;
    }
    state.people.forEach((p, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input data-f="name" placeholder="الاسم"></td>
        <td><input data-f="title" placeholder="المسمى الوظيفي"></td>
        <td><div class="sig-cell tap"></div></td>
        <td class="del no-print"><button class="del-btn" title="حذف">×</button></td>`;
      tr.querySelectorAll('input').forEach(inp => {
        inp.value = p[inp.dataset.f] || '';
        inp.addEventListener('input', () => {
          p[inp.dataset.f] = inp.value; save();
          if (inp.dataset.f === 'name') renderMembers();
        });
      });
      const cell = tr.querySelector('.sig-cell');
      paintSig(cell, p.sig);
      cell.onclick = () => openPad(p.name ? 'توقيع: ' + p.name : 'التوقيع', sig => {
        p.sig = sig; save(); paintSig(cell, sig);
      });
      tr.querySelector('.del-btn').onclick = () => {
        if (p.sig && !confirm('هذا العضو وقّع، حذفه نهائياً؟')) return;
        state.people.splice(i, 1); save(); render();
      };
      tbody.appendChild(tr);
    });
  }

  function paintSig(cell, sig){
    if (sig){ cell.classList.add('signed'); cell.innerHTML = `<img src="${sig}" alt="توقيع">`; }
    else { cell.classList.remove('signed'); cell.innerHTML = '<span class="no-print">اضغط للتوقيع</span>'; }
  }

  document.getElementById('addBtn').onclick = () => {
    state.people.push({ name:'', title:'', sig:null });
    save(); render();
    const inputs = tbody.querySelectorAll('input[data-f="name"]');
    inputs[inputs.length - 1].focus();
  };

  document.getElementById('newBtn').onclick = () => {
    if (!confirm('بدء محضر جديد؟ سيتم مسح البيانات الحالية.')) return;
    state = blank(); save(); location.reload();
  };

  // ===== إنشاء ملف PDF (يرسم الصفحات بنفسه فيطلع نفس الشكل على أي جهاز) =====
  const PX = 1241, PY = 1754, S = 2;              // A4 بدقة 150 نقطة/إنش، مضاعفة للوضوح
  const L = 106, R = 1098, CW = R - L, TOP = 262, BOTTOM = 1560;
  const COL = { label:'#E8E1D6', line:'#cfc6b2', ink:'#1f2a26', gold:'#C0A050' };
  const FONT = '"IBM Plex Sans Arabic", Tahoma, sans-serif';
  const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });

  async function buildPages(){
    try { await document.fonts.load('400 20px "IBM Plex Sans Arabic"'); await document.fonts.load('700 20px "IBM Plex Sans Arabic"'); } catch(e){}
    const lh = await loadImg(LH);
    const pages = []; let ctx, y;

    function newPage(){
      const c = document.createElement('canvas'); c.width = PX * S; c.height = PY * S;
      ctx = c.getContext('2d'); ctx.scale(S, S);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PX, PY);
      ctx.drawImage(lh, 0, 0, PX, PY);
      ctx.direction = 'rtl'; ctx.textBaseline = 'middle';
      pages.push(c); y = TOP;
    }
    const ensure = h => { if (y + h > BOTTOM) newPage(); };
    function text(t, x, yy, { size = 22, weight = 400, align = 'right', maxW } = {}){
      t = String(t || '');
      ctx.font = `${weight} ${size}px ${FONT}`;
      if (maxW) while (ctx.measureText(t).width > maxW && size > 12){ size--; ctx.font = `${weight} ${size}px ${FONT}`; }
      ctx.fillStyle = COL.ink; ctx.textAlign = align; ctx.fillText(t, x, yy);
    }
    function box(x, yy, w, h, fill){
      if (fill){ ctx.fillStyle = fill; ctx.fillRect(x, yy, w, h); }
      ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5; ctx.strokeRect(x, yy, w, h);
    }
    function titleBox(t, size = 30, h = 62){
      ensure(h); const w = CW * 0.7, x = L + (CW - w) / 2;
      ctx.fillStyle = COL.label; ctx.fillRect(x, y, w, h);
      text(t, x + w / 2, y + h / 2, { size, weight:700, align:'center' }); y += h + 18;
    }
    function infoTable(rows){
      const w = CW * 0.8, x = L + (CW - w) / 2, lw = w * 0.26, rh = 50;
      rows.forEach(([k, v]) => {
        ensure(rh);
        box(x, y, w - lw, rh, '#fff'); box(x + w - lw, y, lw, rh, COL.label);
        text(k, x + w - 14, y + rh / 2, { size:21, weight:700 });
        text(v, x + w - lw - 14, y + rh / 2, { size:21, maxW: w - lw - 28 });
        y += rh;
      });
      y += 26;
    }
    function wrap(t, maxW, size){
      ctx.font = `400 ${size}px ${FONT}`;
      const out = [];
      String(t || '').split('\n').forEach(par => {
        let line = '';
        par.split(' ').forEach(word => {
          const test = line ? line + ' ' + word : word;
          if (ctx.measureText(test).width > maxW && line){ out.push(line); line = word; }
          else line = test;
        });
        out.push(line);
      });
      while (out.length && !out[out.length - 1].trim()) out.pop();
      return out;
    }
    function section(head, body){
      ensure(90);
      ctx.save(); ctx.translate(R - 8, y + 20); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = COL.gold; ctx.fillRect(-6, -6, 12, 12); ctx.restore();
      text(head, R - 26, y + 20, { size:24, weight:700 }); y += 50;
      const lines = wrap(body, CW - 20, 21);
      if (!lines.length) y += 40;
      lines.forEach(l => { ensure(40); text(l, R - 10, y + 20, { size:21 }); y += 40; });
      y += 26;
    }

    const H = state.header, people = state.people;

    // الصفحة الأولى: المحضر
    newPage();
    titleBox('محضر اجتماع');
    infoTable([['اليوم', H.day], ['التاريخ', H.date], ['رقم الاجتماع', H.num], ['زمن الاجتماع', H.duration], ['وقت الاجتماع', H.time]]);
    titleBox('أعضاء الاجتماع', 25, 50);
    const names = people.map(p => p.name).filter(n => n && n.trim());
    const mrows = Math.max(2, Math.ceil(names.length / 3)), cw = CW / 3, mh = 46;
    for (let r = 0; r < mrows; r++){
      ensure(mh);
      for (let k = 0; k < 3; k++){
        const x = R - (k + 1) * cw; box(x, y, cw, mh, '#fff');
        text(names[r * 3 + k] || '', x + cw / 2, y + mh / 2, { size:20, align:'center', maxW: cw - 16 });
      }
      y += mh;
    }
    y += 30;
    section('محاور الاجتماع:', H.topics);
    section('التوصيات:', H.recs);

    // الصفحة الثانية: توقيع الحضور
    newPage();
    titleBox('توقيع حضور الاجتماع');
    infoTable([['اليوم', H.day], ['التاريخ', H.date]]);
    const cols = [['الاسم', 0.36], ['المسمى الوظيفي', 0.30], ['التوقيع', 0.34]];
    const header = () => {
      let x = R;
      cols.forEach(([t, f]) => { const w = CW * f; x -= w; box(x, y, w, 46, COL.label); text(t, x + w / 2, y + 23, { size:20, weight:600, align:'center' }); });
      y += 46;
    };
    header();
    const rh = 66, list = people.length ? people : [{}, {}, {}];
    for (const p of list){
      if (y + rh > BOTTOM){ newPage(); header(); }
      let x = R; const ws = cols.map(([, f]) => CW * f);
      x -= ws[0]; box(x, y, ws[0], rh, '#fff'); text(p.name, x + ws[0] / 2, y + rh / 2, { size:20, align:'center', maxW: ws[0] - 16 });
      x -= ws[1]; box(x, y, ws[1], rh, '#fff'); text(p.title, x + ws[1] / 2, y + rh / 2, { size:20, align:'center', maxW: ws[1] - 16 });
      x -= ws[2]; box(x, y, ws[2], rh, '#fff');
      if (p.sig){
        const img = await loadImg(p.sig);
        const k = Math.min((ws[2] - 24) / img.width, (rh - 12) / img.height);
        const iw = img.width * k, ih = img.height * k;
        ctx.drawImage(img, x + (ws[2] - iw) / 2, y + (rh - ih) / 2, iw, ih);
      }
      y += rh;
    }
    return pages;
  }

  document.getElementById('printBtn').onclick = async () => {
    const unsigned = state.people.filter(p => !p.sig).length;
    if (unsigned && !confirm(`باقي ${unsigned} من الأعضاء ما وقّعوا. تكمل؟`)) return;
    const btn = document.getElementById('printBtn');
    if (!window.jspdf){ alert('تعذّر تحميل أداة الـ PDF. تأكد من الاتصال بالإنترنت وحدّث الصفحة.'); return; }
    btn.disabled = true; btn.textContent = 'جاري تجهيز الملف…';
    try {
      const pages = await buildPages();
      const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
      pages.forEach((c, i) => {
        if (i) pdf.addPage();
        pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297);
      });
      const name = 'محضر اجتماع' + (state.header.num ? ' رقم ' + state.header.num : '') + '.pdf';
      pdf.save(name);
    } catch(e){
      alert('صار خطأ أثناء تجهيز الملف، حاول مرة ثانية.');
    } finally {
      btn.disabled = false; btn.textContent = 'حفظ PDF';
    }
  };

  // ===== لوحة التوقيع =====
  const modal = document.getElementById('modal');
  const pad = document.getElementById('pad');
  const ctx = pad.getContext('2d');
  const hint = document.getElementById('padHint');
  let drawing = false, hasInk = false, last = null, onDone = null;

  function setupCanvas(){
    const r = pad.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    pad.width = r.width * dpr; pad.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#163a2e'; ctx.fillStyle = '#163a2e';
    hasInk = false; hint.style.display = '';
  }
  const pos = e => { const r = pad.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };

  pad.addEventListener('pointerdown', e => {
    drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fill();
    hasInk = true; hint.style.display = 'none';
  });
  pad.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y);
    ctx.quadraticCurveTo(last.x, last.y, (last.x + p.x) / 2, (last.y + p.y) / 2);
    ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => pad.addEventListener(ev, () => { drawing = false; }));

  function openPad(title, cb){
    document.getElementById('modalTitle').textContent = title;
    onDone = cb; modal.classList.add('open');
    requestAnimationFrame(setupCanvas);
  }
  function closePad(){ modal.classList.remove('open'); onDone = null; }

  function trimmed(){
    const { width:w, height:h } = pad;
    const d = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = 0, maxY = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      if (d[(y * w + x) * 4 + 3] > 0){
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    const m = 8;
    minX = Math.max(0, minX - m); minY = Math.max(0, minY - m);
    maxX = Math.min(w, maxX + m); maxY = Math.min(h, maxY + m);
    const out = document.createElement('canvas');
    out.width = maxX - minX; out.height = maxY - minY;
    out.getContext('2d').drawImage(pad, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    return out.toDataURL('image/png');
  }

  document.getElementById('clearBtn').onclick = setupCanvas;
  document.getElementById('cancelBtn').onclick = closePad;
  document.getElementById('okBtn').onclick = () => {
    if (!hasInk){ alert('المربع فاضي، وقّع أولاً'); return; }
    const sig = trimmed(); if (onDone) onDone(sig); closePad();
  };
  window.addEventListener('resize', () => { if (modal.classList.contains('open')) setupCanvas(); });

  mirror();
  render();
</script>
</body>
</html>
